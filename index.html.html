<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEK AI – YKS Çalışma Programı</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--panel:#f7f9fc;--panel-2:#f1f4f9;--card:#ffffff;
  --line:#e3e8f0;--line-2:#d3dbe8;--text:#0a1730;--text-2:#3d4d6b;--muted:#7a88a6;
  --navy:#0a1730;--navy-2:#142a56;--navy-3:#1e3a72;
  --acc:#ff8a1f;--acc-2:#ff5e00;--acc-soft:#fff7ed;--acc-line:#ffd9a8;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:14px;
}
html,body{height:100%}
body{background:#fff;color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex:0 0 252px;background:linear-gradient(180deg,#0d1e40,#081428);border-right:1px solid #0a1730;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px}
.brand-logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc-2));box-shadow:0 8px 22px -8px var(--acc)}
.brand-txt strong{display:block;font-size:15px;letter-spacing:.3px;color:#fff}
.brand-txt span{font-size:11px;color:#9db1d8}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:#9db1d8;font-size:14px;font-weight:500;text-align:left;transition:.16s;width:100%}
.nav button:hover{background:#12254c;color:#fff}
.nav button.active{background:linear-gradient(90deg,rgba(255,138,31,.28),rgba(255,94,0,.12));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,138,31,.5)}
.nav .ico{width:20px;text-align:center;font-size:15px}
.side-foot{margin-top:22px;padding:12px;border-radius:12px;background:#0a1836;border:1px solid #1e3a72;font-size:11.5px;color:#9db1d8;line-height:1.6}

.main{flex:1;min-width:0;padding:20px 26px 90px;background:#fff}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.hamb{display:none;width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:19px;color:var(--navy)}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:.2px;color:var(--navy)}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
.topbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;transition:.16s;white-space:nowrap;color:var(--navy)}
.btn:hover{background:var(--panel);border-color:var(--line-2)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc-2));border:none;color:#fff;box-shadow:0 10px 24px -12px var(--acc)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:9px}
.btn.ok{background:#dcfce7;border-color:#86efac;color:#15803d;font-weight:800}
.btn.ok:hover{background:#bbf7d0;border-color:#4ade80}
.btn.todo{background:#fef2f2;border-color:#fecaca;color:#b91c1c;font-weight:800}
.btn.todo:hover{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.btn.danger{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.btn.purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);border:none;color:#fff}
.btn.icon{padding:7px 9px;font-size:12px;border-radius:9px;min-width:34px;justify-content:center}

#pomodoroHost{margin-bottom:20px}
.pomo-wrap{background:linear-gradient(135deg,#fff 0%,#fffaf3 50%,#fff7ed 100%);border:1px solid var(--acc-line);border-radius:20px;padding:22px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;color:var(--navy);box-shadow:0 18px 50px -26px rgba(255,138,31,.6),0 0 0 1px rgba(255,255,255,.6) inset;position:relative;overflow:hidden}
.pomo-wrap::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,138,31,.18),transparent 65%);pointer-events:none}
.pomo-wrap.break-mode{background:linear-gradient(135deg,#f0fdf4 0%,#fff 100%);border-color:#bbf7d0;box-shadow:0 18px 50px -26px rgba(16,163,74,.5)}
.pomo-wrap.break-mode::before{background:radial-gradient(circle,rgba(16,163,74,.18),transparent 65%)}
.pomo-ring{position:relative;width:170px;height:170px;flex:0 0 auto}
.pomo-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pomo-ring .track{fill:none;stroke:#ffe1bd;stroke-width:9}
.pomo-ring .fill{fill:none;stroke:url(#pomoGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.pomo-wrap.break-mode .pomo-ring .track{stroke:#bbf7d0}
.pomo-ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-ring .time{font-size:38px;font-weight:800;letter-spacing:-1.5px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.pomo-ring .label{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#c2410c;margin-top:6px}
.pomo-wrap.break-mode .pomo-ring .label{color:#15803d}
.pomo-info h4{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:4px}
.pomo-info .pomo-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.pomo-task-lbl{font-size:10.5px;color:#94a3b8;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.pomo-info select{width:100%;background:#fff;border:1px solid #e2e8f0;color:var(--navy);border-radius:11px;padding:10px 12px;font-size:13px;outline:none;font-weight:600}
.pomo-info select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,138,31,.15)}
.pomo-modes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pom-mode{font-size:11px;padding:6px 11px;border-radius:9px;background:#fff;border:1px solid #e2e8f0;color:#64748b;font-weight:700;cursor:pointer;transition:.14s}
.pom-mode:hover{border-color:#ffb066;color:#c2410c}
.pom-mode.on{background:linear-gradient(135deg,#ff8a1f,#ff5e00);border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px var(--acc)}
.pomo-stats{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.pom-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-pom{padding:11px 18px;border-radius:12px;font-weight:800;font-size:13px;background:#fff;border:1px solid #e2e8f0;color:var(--navy);transition:.15s;box-shadow:0 2px 6px -3px rgba(10,23,48,.15)}
.btn-pom:hover{background:#fff7ed;border-color:var(--acc);transform:translateY(-1px)}
.btn-pom.primary{background:linear-gradient(135deg,var(--acc),var(--acc-2));border:none;color:#fff;box-shadow:0 10px 26px -10px var(--acc)}
.btn-pom.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.pom-count-badge{font-size:12.5px;font-weight:800;color:#c2410c;background:#fff;border:1px solid var(--acc-line);padding:9px 14px;border-radius:12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pomo-wrap.break-mode .pom-count-badge{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
@media (max-width:820px){.pomo-wrap{grid-template-columns:1fr;text-align:center;gap:18px;padding:20px}.pomo-ring{margin:0 auto}.pomo-stats{align-items:center}.pom-btns{justify-content:center}}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 2px 10px -6px rgba(10,23,48,.08)}
.panel h2{font-size:12.5px;font-weight:800;letter-spacing:.6px;margin-bottom:14px;color:#c2410c;text-transform:uppercase}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{margin:0;flex:1;font-size:12.5px;font-weight:800;letter-spacing:.6px;color:#c2410c;text-transform:uppercase}

.badges-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.badges-strip::-webkit-scrollbar{height:6px}
.badges-strip::-webkit-scrollbar-thumb{background:#e3e8f0;border-radius:6px}
.badge-card{min-width:110px;padding:12px 10px;border-radius:14px;background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid var(--line);text-align:center;transition:.18s;flex:0 0 auto;position:relative}
.badge-card.locked{opacity:.42;filter:grayscale(.7)}
.badge-card.earned{border-color:var(--acc-line);box-shadow:0 6px 18px -8px rgba(255,138,31,.5)}
.badge-card.earned::after{content:"✓";position:absolute;top:6px;right:8px;background:#10b981;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;display:grid;place-items:center}
.badge-card:hover{transform:translateY(-2px);border-color:var(--acc-line)}
.badge-card .b-icon{font-size:28px;line-height:1;margin-bottom:6px}
.badge-card .b-label{font-size:11.5px;font-weight:800;color:var(--navy);margin-bottom:3px}
.badge-card .b-desc{font-size:10px;color:var(--muted);line-height:1.35}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

.badge-toast{position:fixed;top:24px;right:24px;z-index:500;background:linear-gradient(135deg,#fff7ed,#ffffff);border:2px solid var(--acc);border-radius:14px;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 50px -18px rgba(255,138,31,.75);transform:translateX(140%);transition:transform .4s cubic-bezier(.2,.9,.3,1.2);min-width:280px}
.badge-toast.show{transform:translateX(0)}
.badge-toast .bt-icon{font-size:32px}
.badge-toast .bt-txt{flex:1}
.badge-toast .bt-title{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#c2410c;text-transform:uppercase;margin-bottom:3px}
.badge-toast .bt-name{font-size:14px;font-weight:800;color:var(--navy)}
.badge-toast .bt-desc{font-size:11px;color:var(--muted);margin-top:2px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative;overflow:hidden;box-shadow:0 2px 10px -6px rgba(10,23,48,.06)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--acc),var(--acc-2))}
.stat .lbl{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:700}
.stat .val{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.5px;color:var(--navy)}
.stat .val small{font-size:12px;color:var(--muted);font-weight:600}
.stat .bar{height:5px;border-radius:4px;background:#eef2f8;margin-top:9px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc-2))}

.day{margin-bottom:26px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-left:4px;flex-wrap:wrap}
.day-head h3{font-size:15px;font-weight:800;letter-spacing:1.1px;color:var(--navy)}
.day-head .day-sub{font-size:12px;color:var(--muted)}
.day.today .day-head h3{color:#c2410c}
.day.today .day-head h3::before{content:"●";color:var(--acc);font-size:10px;margin-right:8px;vertical-align:2px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:.18s;position:relative;overflow:hidden;color:var(--text);box-shadow:0 2px 12px -6px rgba(10,23,48,.07)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--acc),var(--acc-2));opacity:.9}
.card.review::before{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
.card.paragraph::before{background:linear-gradient(180deg,#34d399,#10b981)}
.card.repetition::before{background:linear-gradient(180deg,#a78bfa,#8b5cf6)}
.card:hover{border-color:var(--acc-line);transform:translateY(-1px);box-shadow:0 8px 22px -10px rgba(10,23,48,.14)}
.card.done{opacity:.72;background:#fafbfd}
.card.done::before{background:#94a3b8}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:20px;background:var(--acc-soft);color:#c2410c;border:1px solid var(--acc-line)}
.pill.ayt{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.pill.rep{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.time{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:auto}
.card h4{font-size:14.5px;font-weight:800;letter-spacing:.2px;color:var(--navy)}
.card .topic{font-size:13px;color:var(--text-2);line-height:1.45;font-weight:500}
.card .meta{font-size:11.5px;color:var(--muted)}
.res{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--text-2);transition:.15s;display:inline-flex;align-items:center;gap:4px}
.chip:hover{background:var(--acc-soft);border-color:var(--acc-line);color:#c2410c}
.chip.yt{border-color:#fecaca;color:#b91c1c;background:#fff7f7}
.chip.yt-play{border-color:#fecaca;color:#b91c1c;background:#fef2f2;font-weight:800}
.chip.ogm-ozet{border-color:#bbf7d0;color:#15803d;background:#f0fdf4}
.chip.ogm-den{border-color:#bfdbfe;color:#1d4ed8;background:#eff6ff}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.actions .btn{flex:1;justify-content:center;min-width:88px}

.review-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.review-list li{font-size:12.5px;color:var(--text-2);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;line-height:1.5}
.review-list li b{color:var(--navy);font-weight:800;display:block;margin-bottom:2px}
.review-list li .rev-topic{color:var(--text-2);font-weight:500;font-size:12px;margin-bottom:8px}

.par-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.par-row label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;font-weight:700}
.par-row input{width:58px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;text-align:center;color:var(--navy);font-weight:700}
.par-score{font-size:12px;color:var(--ok);font-weight:800}

.overlay{position:fixed;inset:0;background:rgba(10,23,48,.55);backdrop-filter:blur(4px);display:none;z-index:200;padding:20px;overflow:auto}
.overlay.open{display:block}
.modal{max-width:640px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 90px -30px rgba(10,23,48,.35);animation:pop .18s ease;color:var(--text)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-head h3{font-size:16px;font-weight:800;flex:1;color:var(--navy)}
.modal-head .x{width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:16px;color:var(--navy);display:grid;place-items:center}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;transition:.15s;width:100%;color:var(--navy);font-weight:500}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(255,138,31,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{padding:9px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text-2);transition:.15s;cursor:pointer;user-select:none}
.chk.on{background:linear-gradient(135deg,rgba(255,138,31,.15),rgba(255,94,0,.08));border-color:var(--acc);color:#c2410c}
.note{font-size:11.5px;color:var(--muted);line-height:1.55}
.info-box{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:600;line-height:1.55;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.divider{height:1px;background:var(--line);margin:16px 0}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.wiz-step{font-size:11px;font-weight:800;letter-spacing:.6px;color:#94a3b8;text-transform:uppercase;margin-bottom:8px}
.opt-lbl{font-size:10.5px;color:#94a3b8;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-left:6px}

.steps{list-style:none;display:flex;flex-direction:column;gap:7px;margin:4px 0}
.steps li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:600;cursor:pointer;user-select:none;transition:.15s}
.steps li:hover{background:#fff;border-color:var(--acc-line);transform:translateX(2px)}
.steps li .n{width:22px;height:22px;border-radius:6px;background:var(--acc-soft);display:grid;place-items:center;font-size:11px;font-weight:800;color:#c2410c;flex:0 0 auto;border:1px solid var(--acc-line)}
.steps li.done{background:#f0fdf4;border-color:#bbf7d0;color:#15803d;font-weight:700}
.steps li.done .n{background:#10b981;color:#fff;border-color:#10b981}
.steps-hint{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}

.ai-out{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;line-height:1.65;color:var(--text-2);white-space:pre-wrap;max-height:340px;overflow:auto}
.q-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.q-block .q{font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--navy)}
.opt{display:flex;align-items:flex-start;gap:9px;font-size:13px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--text-2);font-weight:500}
.opt input{margin-top:2px;accent-color:var(--acc)}
.opt.correct{background:#f0fdf4;border:1px solid #bbf7d0}
.opt.wrong{background:#fef2f2;border:1px solid #fecaca}

.rowlist{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap;color:var(--text);transition:.15s}
a.row:hover{border-color:var(--acc-line);background:#fff}
.row .grow{flex:1;min-width:180px}
.row .t{font-size:13.5px;font-weight:800;color:var(--navy)}
.row .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px}
.badge.ok{background:#f0fdf4;color:#15803d}
.badge.warn{background:#fffbeb;color:#b45309}
.badge.bad{background:#fef2f2;color:#b91c1c}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:12px}
.empty h3{color:var(--navy);font-size:16px;margin-bottom:6px;font-weight:800}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--navy);border:1px solid var(--navy-3);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:400;transition:.25s;pointer-events:none;box-shadow:0 20px 40px -20px rgba(10,23,48,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.pom{background:linear-gradient(135deg,var(--acc),var(--acc-2));border:none}
.toast.green{background:linear-gradient(135deg,#10b981,#059669);border:none}

.sidebar-overlay{position:fixed;inset:0;background:rgba(10,23,48,.5);z-index:55;display:none}
.sidebar-overlay.open{display:block}

.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.chart-card h3{font-size:12.5px;font-weight:800;letter-spacing:.5px;color:#c2410c;text-transform:uppercase;margin-bottom:12px}
.chart-card canvas{width:100%;height:220px;display:block}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700;margin-top:8px}
.chart-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.hbar-list{display:flex;flex-direction:column;gap:9px}
.hbar{display:flex;align-items:center;gap:10px}
.hbar .hb-name{width:120px;font-size:12px;font-weight:700;color:var(--navy);flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hb-track{flex:1;height:8px;background:#eef2f8;border-radius:5px;overflow:hidden}
.hbar .hb-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-2))}
.hbar .hb-val{font-size:12px;font-weight:800;color:var(--navy);min-width:44px;text-align:right}
.hbar .hb-sub{font-size:10.5px;color:var(--muted);min-width:60px;text-align:right}

.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dl-card{background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;transition:.18s;cursor:pointer}
.dl-card:hover{border-color:var(--acc-line);transform:translateY(-2px);box-shadow:0 8px 22px -10px rgba(10,23,48,.14)}
.dl-card .dl-icon{font-size:34px;line-height:1;margin-bottom:8px}
.dl-card .dl-t{font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:4px}
.dl-card .dl-s{font-size:11px;color:var(--muted);line-height:1.5}

.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .22s ease}
  .sidebar.open{transform:none}
  .hamb{display:grid;place-items:center}
  .main{padding:16px 14px 90px}
  .cards{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat .val{font-size:19px}
}

/* ============ PROGRAM ÜRETİCİ ============ */
function computeAytStart(start){
  const m = start.getMonth();
  if(m >= 11) return new Date(start);
  if(m >= 8)  return new Date(start.getFullYear(), 11, 1);
  return new Date(start);
}
function buildPools(){
  const pools = []; const seen = new Set();
  const types = (state.setup.examTypes && state.setup.examTypes.length ? state.setup.examTypes.slice() : ["TYT"])
    .sort((a,b)=> (a==="TYT"?-1 : b==="TYT"?1 : 0));
  const weak = ((state.setup && state.setup.weakTopics) || []).map(w=>w.trim().toLowerCase()).filter(Boolean);
  types.forEach(t=>{
    const block = CURRICULUM[t]; if(!block) return;
    Object.entries(block).forEach(([subject, topics])=>{
      const sig = subject + "|" + topics.join(",");
      if(seen.has(sig)) return; seen.add(sig);
      let weight = SUBJECT_WEIGHTS[t+"::"+subject] ?? 1;
      const hits = topics.filter(tp => weak.some(w => tp.toLowerCase().includes(w) || w.includes(tp.toLowerCase())));
      let ordered = topics.slice();
      if(hits.length){ weight *= 1.35; ordered = hits.concat(topics.filter(x=>!hits.includes(x))); }
      pools.push({ examType: t, phase: t === "TYT" ? "TYT" : "AYT", subject, topics: ordered, weight, idx: 0 });
    });
  });
  return pools;
}
function buildProgram(){
  const start = fromIso(state.setup.startDate || iso(new Date()));
  const end = fromIso(state.setup.examDate || DEFAULT_EXAM_DATE);
  const aytStart = computeAytStart(start);
  const pools = buildPools();
  const credits = pools.map(p => ({ p, c: 0 }));
  const program = []; let d = new Date(start); let guard = 0;
  while(d <= end && guard < 400){
    const dayIso = iso(d); const isAyt = d >= aytStart;
    const active = credits.filter(x => x.p.phase === "TYT" || isAyt);
    let totalW = 0;
    active.forEach(x=>{ x.w = x.p.weight * (x.p.phase === "TYT" && isAyt ? 0.75 : 1); totalW += x.w; });
    const cards = [];
    if(totalW > 0){
      for(let slot=0; slot<2; slot++){
        let best = null;
        active.forEach(x=>{ if(x.p.idx >= x.p.topics.length) return; if(!best || x.c > best.c) best = x; });
        if(!best) break;
        const topic = best.p.topics[best.p.idx++];
        cards.push({ id: dayIso + "-" + slot, time: slot === 0 ? "10:00 – 11:00" : "11:00 – 12:00",
          type: "lesson", phase: best.p.phase, examType: best.p.examType, subject: best.p.subject, topic,
          q: QUESTION_COUNT[best.p.subject] ?? 15, done: false });
        best.c -= totalW; active.forEach(x => { x.c += x.w; });
      }
    }
    const prev = program[program.length - 1];
    const reviewItems = prev ? prev.cards.filter(c => c.type === "lesson").map(c => ({ examType:c.examType, subject:c.subject, topic:c.topic })) : [];
    cards.push({ id: dayIso + "-r", time: "12:00 – 13:00", type: "review", items: reviewItems, done: false });
    cards.push({ id: dayIso + "-p", time: "15:00", type: "paragraph", target: 20, correct: 0, wrong: 0, empty: 0, done: false });
    program.push({ iso: dayIso, cards });
    d.setDate(d.getDate() + 1); guard++;
  }
  return program;
}
function getRepetitionsForDay(dayIso){ return state.repetitions.filter(r => r.targetDate === dayIso); }

/* ============ İSTATİSTİK ============ */
function computeStats(){
  let totalLessons = 0, doneLessons = 0, tytT = 0, tytD = 0, aytT = 0, aytD = 0, questions = 0, hours = 0, paragraph = 0;
  state.program.forEach(day=>{
    day.cards.forEach(c=>{
      if(c.type === "lesson"){
        totalLessons++;
        if(c.examType === "TYT"){ tytT++; } else { aytT++; }
        if(c.done){ doneLessons++; questions += (c.q || 0); hours += 1; if(c.examType === "TYT") tytD++; else aytD++; }
      }
      if(c.type === "review" && c.done) hours += 1;
      if(c.type === "paragraph" && c.done){ hours += 1; paragraph += (c.correct||0) + (c.wrong||0) + (c.empty||0); }
    });
  });
  const map = {}; state.program.forEach(day=>{ map[day.iso] = day.cards.some(c=>c.done); });
  let streak = 0, cur = new Date();
  if(!map[iso(cur)]) cur.setDate(cur.getDate()-1);
  while(map[iso(cur)]){ streak++; cur.setDate(cur.getDate()-1); }
  return {
    overall: totalLessons ? Math.round(doneLessons/totalLessons*100) : 0,
    tyt: tytT ? Math.round(tytD/tytT*100) : 0,
    ayt: aytT ? Math.round(aytD/aytT*100) : 0,
    doneLessons, totalLessons, questions, hours, streak, paragraph
  };
}
function weakTopics(){
  const map = {};
  state.tests.forEach(t=>{
    const k = t.examType + "|" + t.subject + "|" + t.topic;
    if(!map[k]) map[k] = { examType:t.examType, subject:t.subject, topic:t.topic, c:0, w:0, e:0 };
    map[k].c += t.correct; map[k].w += t.wrong; map[k].e += t.empty;
  });
  return Object.values(map).map(x=>{ const tot = x.c + x.w + x.e; return Object.assign(x, { total: tot, rate: tot ? Math.round(x.c/tot*100) : 0 }); }).sort((a,b)=> a.rate - b.rate);
}

function downloadFile(filename, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 100);
}

          <div class="label">${pomoRuntime.mode === "break" ? "MOLA" : "ÇALIŞMA"}</div>
        </div>
      </div>
      <div class="pomo-info">
        <h4>🍅 Pomodoro Zamanlayıcı</h4>
        <div class="pomo-sub">Odaklan, çalış, dinlen — döngüyü tekrarla.</div>
        <div class="pomo-task-lbl">Çalıştığın görev</div>
        <select id="pomoTask">${taskOptions}</select>
        <div class="pomo-modes" id="pomoModes">
          <span class="pom-mode ${preset==="25"?"on":""}" data-mode="25">25 / 5</span>
          <span class="pom-mode ${preset==="50"?"on":""}" data-mode="50">50 / 10</span>
          <span class="pom-mode ${preset==="custom"?"on":""}" data-mode="custom">Özel</span>
        </div>
      </div>
      <div class="pomo-stats">
        <div class="pom-btns">
          <button class="btn-pom primary" id="pomoStart">${pomoRuntime.running ? "⏸ Duraklat" : "▶ Başlat"}</button>
          <button class="btn-pom" id="pomoReset">↻ Sıfırla</button>
        </div>
        <div class="pom-count-badge">🍅 Bugün: <b style="margin-left:4px">${state.pomodoro.count}</b> Pomodoro</div>
      </div>
    </div>
  `;
  pomoUpdateRing();
  $("#pomoStart").onclick = ()=>{ if(pomoRuntime.running) pomoPause(); else pomoStart(); };
  $("#pomoReset").onclick = pomoReset;
  $("#pomoModes").addEventListener("click", e=>{
    const m = e.target.closest(".pom-mode"); if(!m) return;
    const v = m.dataset.mode;
    if(v === "25"){ state.pomodoro.workMin = 25; state.pomodoro.breakMin = 5; }
    else if(v === "50"){ state.pomodoro.workMin = 50; state.pomodoro.breakMin = 10; }
    else {
      const w = prompt("Kaç dakika çalışmak istersin?", state.pomodoro.customWork || 25);
      if(w === null) return;
      const b = prompt("Kaç dakika mola?", state.pomodoro.customBreak || 5);
      if(b === null) return;
      state.pomodoro.customWork = clamp(Number(w)||25, 1, 180);
      state.pomodoro.customBreak = clamp(Number(b)||5, 1, 60);
      state.pomodoro.workMin = state.pomodoro.customWork;
      state.pomodoro.breakMin = state.pomodoro.customBreak;
    }
    save(); pomoReset(); renderPomodoro();
  });
}
function pomoStart(){
  if(pomoRuntime.interval) clearInterval(pomoRuntime.interval);
  pomoRuntime.running = true;
  pomoRuntime.interval = setInterval(pomoTick, 1000);
  renderPomodoro();
}
function pomoPause(){
  pomoRuntime.running = false;
  if(pomoRuntime.interval) clearInterval(pomoRuntime.interval);
  pomoRuntime.interval = null;
  renderPomodoro();
}
function pomoReset(){
  pomoRuntime.running = false;
  if(pomoRuntime.interval) clearInterval(pomoRuntime.interval);
  pomoRuntime.interval = null;
  pomoRuntime.mode = "work";
  pomoRuntime.seconds = pomoWorkSec();
  renderPomodoro();
}
function pomoTick(){
  pomoRuntime.seconds--;
  const timeEl = $("#pomoTime");
  if(timeEl) timeEl.textContent = pomoFormat(Math.max(0, pomoRuntime.seconds));
  pomoUpdateRing();
  if(pomoRuntime.seconds <= 0){
    if(pomoRuntime.interval) clearInterval(pomoRuntime.interval);
    pomoRuntime.interval = null; pomoRuntime.running = false;
    if(pomoRuntime.mode === "work"){
      ensurePomodoroToday(); state.pomodoro.count++;
      const task = pomoSelectedTask() || "Serbest çalışma";
      state.pomodoro.records.push({ date: iso(new Date()), task, minutes: state.pomodoro.workMin });
      save();
      try{ if(window.Notification && Notification.permission === "granted") new Notification("DEK AI", { body: "Pomodoro tamamlandı! 🎉 Mola zamanı." }); }catch(e){}
      toast("Pomodoro tamamlandı! 🎉 Mola zamanı", "pom");
      pomoRuntime.mode = "break"; pomoRuntime.seconds = pomoBreakSec();
      checkBadges();
    } else {
      toast("Mola bitti, çalışmaya dön 💪", "pom");
      pomoRuntime.mode = "work"; pomoRuntime.seconds = pomoWorkSec();
    }
    renderPomodoro();
  }
}
function ensureNotifyPermission(){
  try{ if(window.Notification && Notification.permission === "default") Notification.requestPermission().catch(()=>{}); }catch(e){}
}

function drawDailyChart(){
  const cv = $("#chDaily"); if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 220;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0,0,W,H);
  const days = []; const today = new Date();
  for(let i=13;i>=0;i--){ const d = new Date(today); d.setDate(d.getDate()-i); days.push(iso(d)); }
  const data = days.map(dayIso=>{
    const dt = state.tests.filter(t => t.date === dayIso);
    return { label: GUNLER_KISA[fromIso(dayIso).getDay()],
      correct: dt.reduce((a,t)=>a+(t.correct||0),0),
      wrong:   dt.reduce((a,t)=>a+(t.wrong||0),0),
      empty:   dt.reduce((a,t)=>a+(t.empty||0),0) };
  });
  const maxV = Math.max(1, ...data.map(d=>Math.max(d.correct, d.wrong, d.empty)));
  const padL = 24, padR = 8, padT = 10, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const barGroupW = innerW / data.length, barW = Math.max(3, barGroupW * 0.22);
  ctx.strokeStyle = "#eef2f8"; ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){ const y = padT + innerH * (i/4); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); }
  ctx.fillStyle = "#94a3b8"; ctx.font = "10px Inter, sans-serif"; ctx.textAlign="right";
  ctx.fillText(String(maxV), padL - 4, padT + 8);
  data.forEach((d, i)=>{
    const x0 = padL + i*barGroupW + (barGroupW - barW*3 - 4)/2;
    ctx.fillStyle = "#16a34a"; ctx.fillRect(x0, padT+innerH-(d.correct/maxV)*innerH, barW, (d.correct/maxV)*innerH);
    ctx.fillStyle = "#dc2626"; ctx.fillRect(x0+barW+2, padT+innerH-(d.wrong/maxV)*innerH, barW, (d.wrong/maxV)*innerH);
    ctx.fillStyle = "#94a3b8"; ctx.fillRect(x0+barW*2+4, padT+innerH-(d.empty/maxV)*innerH, barW, (d.empty/maxV)*innerH);
    ctx.fillStyle = "#94a3b8"; ctx.font = "9px Inter, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(d.label, padL + i*barGroupW + barGroupW/2, H - 6);
  });
}
function drawSubjectBars(){
  const el = $("#chSubject"); if(!el) return;
  const map = {};
  state.tests.forEach(t=>{
    if(!map[t.subject]) map[t.subject] = { c:0, w:0, e:0 };
    map[t.subject].c += t.correct||0; map[t.subject].w += t.wrong||0; map[t.subject].e += t.empty||0;
  });
  const rows = Object.entries(map).map(([subject, v])=>{
    const tot = v.c + v.w + v.e;
    return { subject, rate: tot ? Math.round(v.c/tot*100) : 0, tot };
  }).sort((a,b)=> b.tot - a.tot).slice(0, 8);
  if(!rows.length){ el.innerHTML = `<div class="note">Henüz test sonucu yok.</div>`; return; }
  el.innerHTML = rows.map(r=>`<div class="hbar"><div class="hb-name">${esc(r.subject)}</div>
    <div class="hb-track"><div class="hb-fill" style="width:${r.rate}%"></div></div>
    <div class="hb-val">%${r.rate}</div><div class="hb-sub">${r.tot} soru</div></div>`).join("");
}
function drawDenemeChart(){
  const cv = $("#chDeneme"); if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 220;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0,0,W,H);
  const list = state.denemeler.slice().sort((a,b)=> a.date.localeCompare(b.date));
  if(!list.length){ ctx.fillStyle = "#94a3b8"; ctx.font = "13px Inter, sans-serif"; ctx.textAlign="center"; ctx.fillText("Henüz deneme eklenmedi", W/2, H/2); return; }
  const nets = list.map(d => Object.values(d.results).reduce((a,r)=> a + (r.d - r.w/4), 0));
  const maxN = Math.max(1, ...nets);
  const padL = 32, padR = 10, padT = 10, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  ctx.strokeStyle = "#eef2f8";
  for(let i=0;i<=4;i++){ const y = padT + innerH * (i/4); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); }
  ctx.fillStyle = "#94a3b8"; ctx.font = "10px Inter, sans-serif"; ctx.textAlign="right";
  ctx.fillText(maxN.toFixed(0), padL - 4, padT + 8); ctx.fillText("0", padL - 4, padT + innerH + 3);
  const stepX = list.length > 1 ? innerW / (list.length - 1) : 0;
  ctx.strokeStyle = "#ff8a1f"; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.beginPath();
  nets.forEach((n, i)=>{
    const x = padL + i*stepX, y = padT + innerH - (n/maxN)*innerH;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  nets.forEach((n, i)=>{
    const x = padL + i*stepX, y = padT + innerH - (n/maxN)*innerH;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ff8a1f"; ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill();
  });
}
function drawPomoChart(){
  const cv = $("#chPomo"); if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 220;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0,0,W,H);
  const days = []; const today = new Date();
  for(let i=6;i>=0;i--){ const d = new Date(today); d.setDate(d.getDate()-i); days.push(iso(d)); }
  const counts = days.map(dayIso => (state.pomodoro.records||[]).filter(r=> r.date === dayIso).length);
  const maxV = Math.max(1, ...counts);
  const padL = 24, padR = 8, padT = 10, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const barGroupW = innerW / 7, barW = Math.min(28, barGroupW * 0.6);
  ctx.strokeStyle = "#eef2f8";
  for(let i=0;i<=4;i++){ const y = padT + innerH * (i/4); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); }
  ctx.fillStyle = "#94a3b8"; ctx.font = "10px Inter, sans-serif"; ctx.textAlign="right";
  ctx.fillText(String(maxV), padL - 4, padT + 8);
  const grad = ctx.createLinearGradient(0, padT, 0, padT + innerH);
  grad.addColorStop(0, "#ff8a1f"); grad.addColorStop(1, "#ff5e00");
  counts.forEach((v, i)=>{
    const x = padL + i*barGroupW + (barGroupW - barW)/2;
    const h = (v/maxV)*innerH;
    ctx.fillStyle = grad;
    ctx.beginPath(); const r = 6, y = padT + innerH - h;
    ctx.moveTo(x+r, y); ctx.lineTo(x+barW-r, y);
    ctx.quadraticCurveTo(x+barW, y, x+barW, y+r);
    ctx.lineTo(x+barW, padT+innerH); ctx.lineTo(x, padT+innerH); ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0a1730"; ctx.font = "10px Inter, sans-serif"; ctx.textAlign = "center";
    if(v > 0) ctx.fillText(String(v), x + barW/2, padT + innerH - h - 4);
    ctx.fillStyle = "#94a3b8"; ctx.font = "9px Inter, sans-serif";
    ctx.fillText(GUNLER_KISA[fromIso(days[i]).getDay()], padL + i*barGroupW + barGroupW/2, H - 6);
  });
}

function renderBadges(){
  const el = $("#view-badges");
  const earned = state.badges;
  const earnedCount = earned.length;
  const total = BADGE_DEFS.length;
  const byCat = {};
  BADGE_DEFS.forEach(def=>{ if(!byCat[def.cat]) byCat[def.cat] = []; byCat[def.cat].push(def); });
  const sectionsHTML = Object.entries(byCat).map(([cat, defs])=>{
    const cards = defs.map(def=>{
      const isEarned = earned.includes(def.id);
      return `<div class="badge-card ${isEarned?"earned":"locked"}">
        <div class="b-icon">${def.icon}</div>
        <div class="b-label">${esc(def.label)}</div>
        <div class="b-desc">${esc(def.desc)}</div></div>`;
    }).join("");
    return `<div class="panel" style="margin-bottom:18px"><h2>${esc(cat)} Rozetleri</h2><div class="badges-grid">${cards}</div></div>`;
  }).join("");
  const recent = earned.slice(-8).reverse();
  const stripHTML = recent.length ? recent.map(id=>{
    const def = BADGE_DEFS.find(b=>b.id === id); if(!def) return "";
    return `<div class="badge-card earned" style="min-width:96px"><div class="b-icon" style="font-size:24px">${def.icon}</div>
      <div class="b-label" style="font-size:11px">${esc(def.label)}</div></div>`;
  }).join("") : `<div class="note">Henüz rozet kazanmadın. İlk adımı at!</div>`;
  el.innerHTML = `
    <div class="panel" style="margin-bottom:18px;background:linear-gradient(135deg,#fff7ed,#ffffff);border-color:var(--acc-line)">
      <h2>🏆 Kazandığın Rozetler (${earnedCount} / ${total})</h2>
      <div class="badges-strip">${stripHTML}</div>
      <div style="height:8px;border-radius:5px;background:#ffe1bd;margin-top:14px;overflow:hidden">
        <i style="display:block;height:100%;width:${Math.round(earnedCount/total*100)}%;background:linear-gradient(90deg,#ff8a1f,#ff5e00);border-radius:5px;transition:width .5s"></i>
      </div>
      <div class="note" style="margin-top:8px">Toplam ilerleme: %${Math.round(earnedCount/total*100)}</div>
    </div>
    ${sectionsHTML}
  `;
}

function openPlaylistEditor(existing){
  const isEdit = !!existing;
  const subjects = new Set();
  Object.values(CURRICULUM).forEach(block => Object.keys(block).forEach(s => subjects.add(s)));
  subjects.add("Paragraf");
  state.playlists.forEach(p => subjects.add(p.subject));
  const subjList = Array.from(subjects).sort((a,b)=> a.localeCompare(b,"tr"));
  const p = existing || { subject:"", label:"", url:"" };
  openModal(isEdit ? "✏️ Oynatma Listesini Düzenle" : "＋ Yeni Oynatma Listesi", `

      <div class="field full"><label>Ders / Konu</label>

    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>İptal</button>
      ${isEdit ? `<button class="btn danger" id="plDel">Sil</button>` : ``}
      <button class="btn primary" id="plSave">${isEdit ? "Güncelle" : "Ekle"}</button>
    </div>
  `);
  $("#plSave").onclick = ()=>{
    const subject = $("#plSubject").value.trim();
    const label   = $("#plLabel").value.trim();
    let url       = $("#plUrl").value.trim();
    if(!subject) return toast("Ders adı gerekli");
    if(!url) return toast("YouTube linki gerekli");
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    if(!/youtube\.com|youtu\.be/i.test(url)) return toast("Geçerli bir YouTube linki gir");
    if(isEdit){
      const item = state.playlists.find(x=>x.id === existing.id);
      if(item){ item.subject = subject; item.label = label; item.url = url; }
    } else state.playlists.push({ id: uid(), subject, label, url });
    save(); closeModal(); renderAll();
    toast(isEdit ? "Liste güncellendi ✓" : "Liste eklendi ✓");
  };
  const delBtn = $("#plDel");
  if(delBtn) delBtn.onclick = ()=>{
    if(!confirm(`"${existing.subject}" listesini silmek istediğine emin misin?`)) return;
    state.playlists = state.playlists.filter(x=>x.id !== existing.id);
    save(); closeModal(); renderAll(); toast("Liste silindi");
  };
}

    const picked = $$("#wTypes .chk.on").map(x=>x.dataset.t);
    state.setup = {
      examTypes: picked,
      targetDept: ($("#wDept").value || "").trim(),

    };

}
function generate(){
  state.program = buildProgram();
  state.ui.visibleDays = 10;
  save(); renderAll();
}

function openModal(title, body, opts={}){
  const m = $("#modal");
  m.className = "modal" + (opts.wide ? " wide" : "");
  m.innerHTML = `<div class="modal-head"><h3>${title}</h3><button class="x" data-close>✕</button></div>${body}`;
  $("#overlay").classList.add("open");
  m.querySelectorAll("[data-close]").forEach(b=> b.onclick = closeModal);
}
function closeModal(){ $("#overlay").classList.remove("open"); $("#modal").innerHTML=""; }
$("#overlay").addEventListener("click", e=>{ if(e.target.id === "overlay") closeModal(); });

/* ============ AI KATMANI ============ */
async function callGemini(prompt, jsonMode){
  const key = state.settings.geminiKey; if(!key) return null;
  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`;
    const body = { contents:[{ parts:[{ text: prompt }] }] };
    if(jsonMode) body.generationConfig = { responseMimeType:"application/json" };
    const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    return j?.candidates?.[0]?.content?.parts?.[0]?.text || null;
  }catch(e){ console.warn(e); return null; }
}

function openRepetitionModal(card, dayIso){
  const today = new Date();
  const opt3  = new Date(today); opt3.setDate(opt3.getDate() + 3);
  const opt7  = new Date(today); opt7.setDate(opt7.getDate() + 7);
  const opt21 = new Date(today); opt21.setDate(opt21.getDate() + 21);
  openModal(`🔁 Konu Tekrarı — ${esc(card.subject)}`, `
    <div class="note" style="margin-bottom:12px"><b>${esc(card.subject)} – ${esc(card.topic)}</b> konusunu ne zaman tekrar etmek istersin?</div>
    <div class="rowlist">
      <button class="row" data-days="3"><span style="font-size:18px">🌱</span>
        <div class="grow"><div class="t">3 gün sonra</div><div class="s">${iso(opt3)} — kısa süreli pekiştirme</div></div>
        <span class="badge ok">Kısa</span></button>
      <button class="row" data-days="7"><span style="font-size:18px">🌿</span>
        <div class="grow"><div class="t">7 gün sonra</div><div class="s">${iso(opt7)} — haftalık tekrar</div></div>
        <span class="badge warn">Orta</span></button>
      <button class="row" data-days="21"><span style="font-size:18px">🌳</span>
        <div class="grow"><div class="t">21 gün sonra</div><div class="s">${iso(opt21)} — uzun süreli tekrar</div></div>
        <span class="badge bad">Uzun</span></button>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-close>İptal</button></div>
  `, { wide:true });
  $$("#modal [data-days]").forEach(btn=>{
    btn.onclick = ()=>{
      const days = Number(btn.dataset.days);
      const target = new Date(today); target.setDate(target.getDate() + days);
      state.repetitions.push({ id: uid(), examType: card.examType, subject: card.subject, topic: card.topic,
        addedAt: iso(today), targetDate: iso(target), daysAhead: days, done: false });
      save(); closeModal(); renderAll(); toast(`🔁 ${days} gün sonra tekrar eklendi`, "green");
    };
  });
}

function openStudy(dayIso, cardId, isRep){
  const card = isRep ? findRepetitionCard(dayIso, cardId) : findCard(dayIso, cardId);

  const note = state.notes[key] || "";
  const label = EXAM_LABELS[card.examType] || card.examType;
  const pl = findPlaylistFor(card.subject);

  const STEP_LABELS = ["Konu anlatımı","Örnekler","Soru çözümü","Test","Sonuç analizi","Tekrar","Tamamlandı"];
  const stepState = state.steps[key] || [false,false,false,false,false,false,false];
  openModal(`📚 ${esc(card.subject)} – ${esc(card.topic)}`, `
    <div class="res" style="margin-bottom:14px">
      <span class="pill ${card.phase==="AYT"?"ayt":""}">${esc(label)}</span>
      <a class="chip" target="_blank" rel="noopener" href="${mebiUrl(card.examType,card.subject,card.topic)}">📘 MEBİ</a>
      <a class="chip" target="_blank" rel="noopener" href="${ogmUrl()}">📗 ÖGM</a>
      <a class="chip ogm-ozet" target="_blank" rel="noopener" href="${ogmOzetUrl()}">📝 ÖGM Konu Özetleri</a>
      <a class="chip ogm-den" target="_blank" rel="noopener" href="${ogmDenemeUrl()}">📋 ÖGM Denemeleri</a>
      <a class="${ytCls}" target="_blank" rel="noopener" href="${ytUrl(card.examType,card.subject,card.topic)}">${ytLbl}</a>
    </div>
    <h2 style="font-size:12px;letter-spacing:.5px;color:#7a88a6;text-transform:uppercase;margin-bottom:8px">Konu Çalışma Akışı</h2>
    <ul class="steps" id="studySteps">
      ${STEP_LABELS.map((s,i)=>`<li data-step="${i}" class="${stepState[i]?"done":""}">
        <span class="n">${stepState[i]?"✓":(i+1)}</span>${s}</li>`).join("")}
    </ul>
    <div class="steps-hint">💡 İpucu: Adıma tıkla → tamamlandı olarak işaretlenir.</div>
    <div class="divider"></div>
    <div class="info-box" style="background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9">
      <span>🔁</span>
      <div>Bu konuyu tam anlamadıysan tekrar planla. Sistem otomatik olarak uygun güne bir tekrar kartı ekleyecek.</div>
    </div>
    <div class="modal-foot" style="margin-top:10px">
      <button class="btn purple" id="addRepBtn">🔁 Anlamadım, Tekrar Ekle</button>
    </div>
    <div class="divider"></div>
    <h2 style="font-size:12px;letter-spacing:.5px;color:#7a88a6;text-transform:uppercase;margin-bottom:8px">AI Konu Özeti</h2>
    <div id="aiBox" class="ai-out">${state.settings.geminiKey ? "AI özeti üretmek için aşağıdaki butona bas…" : "AI özeti için Ayarlar bölümünde Gemini API anahtarı gir."}</div>
    ${state.settings.geminiKey ? `<div class="modal-foot" style="margin-top:10px"><button class="btn sm" id="aiGen">✨ Özeti Üret</button></div>` : ""}
    <div class="divider"></div>
    <div class="field"><label>Konu Notlarım</label><textarea id="studyNote" rows="5">${esc(note)}</textarea></div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>Kapat</button>
      <button class="btn primary" id="saveNote">Notu Kaydet</button>
    </div>
  `, { wide:true });
  const stepsEl = $("#studySteps");
  if(stepsEl){
    stepsEl.addEventListener("click", ev=>{
      const li = ev.target.closest("[data-step]"); if(!li) return;
      const i = Number(li.dataset.step);
      const cur = state.steps[key] ? state.steps[key].slice() : [false,false,false,false,false,false,false];
      cur[i] = !cur[i]; state.steps[key] = cur; save();
      li.classList.toggle("done", cur[i]);
      li.querySelector(".n").textContent = cur[i] ? "✓" : (i+1);
      if(i === 6 && cur[6]){
        const liveCard = isRep ? findRepetitionCard(dayIso, cardId) : findCard(dayIso, cardId);
        if(liveCard && !liveCard.done){
          liveCard.done = true;
          if(isRep){ const r = state.repetitions.find(x=> "rep-" + x.id === cardId); if(r) r.done = true; }
          save(); toast("Tebrikler! Konu tamamlandı ✓", "green"); checkBadges();
        }
      }
    });
  }
  $("#addRepBtn").onclick = ()=>{ closeModal(); openRepetitionModal(card, dayIso); };
  $("#saveNote").onclick = ()=>{ state.notes[key] = $("#studyNote").value; save(); toast("Not kaydedildi"); closeModal(); };
  const gen = $("#aiGen");
  if(gen) gen.onclick = async ()=>{
    gen.disabled = true; gen.textContent = "Üretiliyor…";
    const prompt = `Sen YKS (${label}) için deneyimli bir öğretmensin.\nDers: ${card.subject}\nKonu: ${card.topic}\nBu konu için kısa ve yoğun bir çalışma özeti hazırla:\n1) Kısa konu anlatımı\n2) Formüller/kavramlar\n3) ÖSYM tarzı noktalar\n4) Sık hatalar\n5) 3 örnek soru\nTürkçe yaz. Uydurma kaynak verme.`;
    const out = await callGemini(prompt, false);
    $("#aiBox").textContent = out || "AI yanıtı alınamadı.";
    gen.disabled = false; gen.textContent = "✨ Özeti Üret";
  };
}

function findRepetitionCard(dayIso, cardId){
  const r = state.repetitions.find(x => "rep-" + x.id === cardId);
  if(!r) return null;
  return { id: cardId, examType: r.examType, subject: r.subject, topic: r.topic,
    phase: r.examType === "TYT" ? "TYT" : "AYT", done: !!r.done };
}

function openTest(dayIso, cardId){
  const card = findCard(dayIso, cardId) || findRepetitionCard(dayIso, cardId);
  if(!card) return;
  openModal(`📝 Test – ${esc(card.subject)} / ${esc(card.topic)}`, `
    <div class="note" style="margin-bottom:14px">AI destekli test veya manuel sonuç girişi.</div>
    <div id="testBody"></div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>Kapat</button>
      <button class="btn" id="tManual">✍️ Manuel Sonuç Gir</button>
      <button class="btn primary" id="tAI">🤖 AI Test Üret</button>
    </div>
  `, { wide:true });
  $("#tManual").onclick = ()=> renderManual(card);
  $("#tAI").onclick = ()=> runAITest(card);
  function renderManual(card){
    $("#testBody").innerHTML = `
      <div class="form-grid">
        <div class="field"><label>Doğru</label><input type="number" id="mC" min="0" value="0"></div>
        <div class="field"><label>Yanlış</label><input type="number" id="mW" min="0" value="0"></div>
        <div class="field"><label>Boş</label><input type="number" id="mE" min="0" value="0"></div>
        <div class="field"><label>Soru sayısı</label><input type="number" id="mT" min="0" value="${card.q||20}"></div>
      </div>
      <div class="modal-foot"><button class="btn primary" id="mSave">Kaydet</button></div>`;
    $("#mSave").onclick = ()=>{
      const correct = Number($("#mC").value)||0, wrong = Number($("#mW").value)||0, empty = Number($("#mE").value)||0;
      state.tests.push({ examType:card.examType, subject:card.subject, topic:card.topic, correct, wrong, empty, date: iso(new Date()) });
      save(); renderAll(); closeModal();
      toast(`Kaydedildi · Başarı %${Math.round(correct/Math.max(1,correct+wrong+empty)*100)}`);
    };
  }
  async function runAITest(card){
    if(!state.settings.geminiKey){
      $("#testBody").innerHTML = `<div class="ai-out">AI test üretimi için Gemini API anahtarı gerekiyor.</div>`; return;
    }
    $("#testBody").innerHTML = `<div class="ai-out">AI sorular hazırlıyor…</div>`;
    const prompt = `YKS ${EXAM_LABELS[card.examType]} için "${card.subject} – ${card.topic}" konusundan 5 çoktan seçmeli soru.\nSadece JSON: [{"q":"...","options":["A","B","C","D"],"answer":0,"explanation":"..."}]`;
    const raw = await callGemini(prompt, true);
    let qs = null; try{ qs = JSON.parse(raw); }catch(e){}
    if(!Array.isArray(qs) || !qs.length){ $("#testBody").innerHTML = `<div class="ai-out">Yanıt ayrıştırılamadı.</div>`; return; }
    $("#testBody").innerHTML = qs.map((q,i)=>`
      <div class="q-block" data-q="${i}">
        <div class="q">${i+1}. ${esc(q.q)}</div>
        ${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}
        <div class="exp note" style="display:none;margin-top:8px">${esc(q.explanation||"")}</div>
      </div>`).join("") + `<div class="modal-foot"><button class="btn primary" id="tSubmit">Testi Bitir</button></div>`;
    $("#tSubmit").onclick = ()=>{
      let correct = 0, wrong = 0, empty = 0;
      qs.forEach((q,i)=>{
        const sel = document.querySelector(`input[name="q${i}"]:checked`);
        const block = document.querySelector(`[data-q="${i}"]`);
        block.querySelectorAll(".opt").forEach((o,j)=>{ if(j === q.answer) o.classList.add("correct"); });
        if(!sel) empty++;
        else if(Number(sel.value) === q.answer) correct++;
        else { wrong++; sel.closest(".opt").classList.add("wrong"); }
        block.querySelector(".exp").style.display = "block";
      });
      state.tests.push({ examType:card.examType, subject:card.subject, topic:card.topic, correct, wrong, empty, date: iso(new Date()) });
      save(); renderAll();
      toast(`Sonuç: ${correct}D · ${wrong}Y · ${empty}B — %${Math.round(correct/qs.length*100)}`);
      $("#tSubmit").outerHTML = `<div class="modal-foot"><button class="btn primary" onclick="closeModal()">Kapat</button></div>`;
    };
  }
}

function openAddResource(card){
  openModal("＋ Kaynak Ekle", `
    <div class="form-grid">
      <div class="field full"><label>Kaynak adı</label><input id="rLabel"></div>
      <div class="field full"><label>Bağlantı</label><input id="rUrl" placeholder="https://…"></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-close>İptal</button>
      <button class="btn primary" id="rSave">Ekle</button></div>
  `);
  $("#rSave").onclick = ()=>{
    const label = $("#rLabel").value.trim() || "Kaynak";
    let url = $("#rUrl").value.trim();
    if(!url) return toast("Bağlantı gerekli");
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    const k = resKey(card);
    (state.resources[k] = state.resources[k] || []).push({ label, url });
    save(); closeModal(); renderAll(); toast("Kaynak eklendi");
  };
}

/* ============ OLAY YÖNETİMİ ============ */
function findCard(dayIso, cardId){
  const day = state.program.find(d=>d.iso === dayIso);
  return day ? day.cards.find(c=>c.id === cardId) : null;
}
document.addEventListener("click", ev=>{
  // Veri yönetimi
  const dlBtn = ev.target.closest("[data-act^='dl-'],[data-act='up-json']");
  if(dlBtn){
    const a = dlBtn.dataset.act;
    if(a === "dl-json") exportJSON();
    else if(a === "dl-pdf") exportPDF();
    else if(a === "dl-csv") exportCSV();
    else if(a === "up-json") $("#importFile").click();
    return;
  }

  const plBtn = ev.target.closest("[data-act='add-pl'],[data-act='edit-pl'],[data-act='del-pl']");
  if(plBtn){
    const a = plBtn.dataset.act;
    if(a === "add-pl"){ openPlaylistEditor(null); return; }
    const id = plBtn.dataset.id;
    const pl = state.playlists.find(x=>x.id === id);
    if(!pl) return;
    if(a === "edit-pl"){ openPlaylistEditor(pl); return; }
    if(a === "del-pl"){
      if(!confirm(`"${pl.subject}" listesini silmek istediğine emin misin?`)) return;
      state.playlists = state.playlists.filter(x=>x.id !== id);
      save(); renderAll(); toast("Liste silindi");
      return;
    }
  }

  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;

  if(act === "del-rep-by-id"){
    const id = el.dataset.id;
    state.repetitions = state.repetitions.filter(x=>x.id !== id);
    save(); renderAll(); toast("Tekrar kaldırıldı"); return;
  }
  if(act === "delres"){
    ev.preventDefault();
    const k = el.dataset.key, i = Number(el.dataset.idx);
    if(state.resources[k]) state.resources[k].splice(i,1);
    save(); renderAll(); return;
  }
  const dayIso = el.dataset.day, cardId = el.dataset.card;
  if(!dayIso || !cardId) return;
  if(act === "del-rep"){
    state.repetitions = state.repetitions.filter(x=> "rep-" + x.id !== cardId);
    save(); renderAll(); toast("Tekrar kaldırıldı"); return;
  }
  const card = findCard(dayIso, cardId);
  const repCard = findRepetitionCard(dayIso, cardId);
  const activeCard = card || repCard;
  if(!activeCard) return;
  if(act === "toggle"){
    if(card) card.done = !card.done;
    else if(repCard){ const r = state.repetitions.find(x=> "rep-" + x.id === cardId); if(r) r.done = !r.done; }
    save(); renderAll(); checkBadges();
  }
  else if(act === "study") openStudy(dayIso, cardId, false);
  else if(act === "study-rep") openStudy(dayIso, cardId, true);
  else if(act === "test") openTest(dayIso, cardId);
  else if(act === "addres") openAddResource(activeCard);
});
document.addEventListener("input", ev=>{
  const el = ev.target.closest("[data-par]"); if(!el) return;
  const card = findCard(el.dataset.day, el.dataset.card); if(!card) return;
  card[el.dataset.par] = Number(el.value) || 0;
  const row = el.closest(".par-row");
  const score = row.querySelector(".par-score");
  const total = (card.correct||0)+(card.wrong||0)+(card.empty||0);
  score.textContent = total ? total + " soru" : "";
  clearTimeout(window._parT);
  window._parT = setTimeout(()=>{ save(); }, 500);
});

  e.preventDefault();
